<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<link rel="icon" type="image/png" href="../logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0a1628);
    color: #fff;
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 6px 8px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  nav a {
    color: rgba(255,255,255,.5);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s ease;
    white-space: nowrap;
  }

  nav a:hover {
    color: #fff;
    background: rgba(255,255,255,.1);
    transform: translateY(-1px);
  }

  nav a.active {
    color: #000;
    background: #fff;
    font-weight: 600;
  }

  nav a.active:hover {
    transform: none;
  }

  .content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 120px 24px 100px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .top-row h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 0 14px;
    height: 38px;
    min-width: 220px;
  }

  .search-bar .icon {
    color: rgba(255,255,255,.3);
    font-size: 14px;
  }

  .search-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }

  .search-bar input::placeholder {
    color: rgba(255,255,255,.3);
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }

  @media (max-width: 900px) {
    .games-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (max-width: 600px) {
    .games-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 400px) {
    .games-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .game-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    transition: all .2s ease;
    cursor: pointer;
  }

  .game-card:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-3px);
    border-color: rgba(255,255,255,.15);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }

  .game-card .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: rgba(255,255,255,.06);
    border-bottom: 1px solid rgba(255,255,255,.06);
    border-radius: 12px 12px 0 0;
    overflow: hidden;
  }

  .game-card .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .game-card .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,.5);
  }

  .game-card .info {
    padding: 10px 12px 12px;
  }

  .game-card .name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,.3);
    font-size: 14px;
    grid-column: 1 / -1;
  }

  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: rgba(255,255,255,.25);
  }
</style>
</head>
<body>

<nav>
  <a href="../">Home</a>
  <a href="../games/" class="active">Games</a>
  <a href="../info/">Information</a>
  <a href="../settings/">Settings</a>
     <a href="../utilities/" class="btn">Utilities</a>
</nav>

<div class="content">
  <div class="top-row">
    <h1>Games Library</h1>
    <div class="search-bar">
      <span class="icon">&#128269;</span>
      <input id="search" type="text" placeholder="Search Games...">
    </div>
  </div>

  <div class="games-grid" id="grid"></div>
</div>

<footer>Created by Pausuu &amp; Binaro26</footer>

<script>
  // Read the list from whichever fork is serving this page (e.g. <owner>.github.io/<repo>/),
  // falling back to this fork when opened elsewhere (localhost, custom domain, file://).
  const DEFAULT_OWNER = 'PeptidesDev';
  const DEFAULT_REPO = 'bacongames';
  const pagesMatch = /^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname);
  const pagesRepo = location.pathname.split('/').filter(Boolean)[0];
  const OWNER = pagesMatch ? pagesMatch[1] : DEFAULT_OWNER;
  const REPO = pagesMatch && pagesRepo && pagesRepo !== 'games' ? pagesRepo : DEFAULT_REPO;
  const GAMES_PATH = 'games';
  const CACHE_KEY = 'bacongames_list_cache_v2'; // v2: list now comes from the serving fork
  const CACHE_TTL_MS = 30 * 60 * 1000; // 30 minutes

  // Square cover art hosted by the game portals themselves
  // (CrazyGames, Poki, GameDistribution, Steam, ...).
  const COVERS = {
 // i need to fix this
  };

  // Baked-in list of game folders, shown instantly and used whenever the GitHub API is
  // unavailable (it allows only 60 unauthenticated requests per hour per IP).
  // Keep in sync with the folders in games/ when adding or removing a game.
  const GAMES = [
    "10 Bullets", "10 Minutes Till Dawn", "12 Mini Battles", "1v1 LOL", "2 Doom", "2048", "2048 Cupcakes",
    "3D Flight Simulator", "8 Ball Pool", "Agar io", "Age of War", "Age of War 2", "Angry Birds",
    "Angry Birds Showdown", "Angry Birds Space", "Appel", "Awsome Tanks", "Awsome Tanks 2",
    "Backrooms Escape", "Bad Piggies", "Baseball Bros", "Basket Bros", "Basketball Legends",
    "Basketball Starz", "Basketrandom", "Bendy and The Ink Machine", "Black Jack", "Block Blast",
    "Blocky Snake", "Bloons TD 1", "Bloons TD 2", "Bloons TD 3", "Bloons TD 4", "Bloons TD 5", "Bloxorz",
    "Blumgi Racers", "Bow Masters", "Boxing Random", "Brawl Stars", "Candy Crush", "Celeste", "Choppy Orc",
    "Cookie Clicker", "Crazy Cattle 3D", "Crossy Road", "Cup Head", "Cut The Rope", "Death Run 3D",
    "Deltarune", "Doodle Jump", "Doom", "Doom 2", "Drift Boss", "Drive Mad", "Duck Life", "Duck Life 2",
    "Duck Life 3", "Duck Life 4", "Duck Life 5", "Dune", "Eggy Car", "Elastic Face", "Escape Road",
    "Escape Road 2", "Fears To Fathom", "Fire Boy and Water Girl", "Fire Boy and Water Girl 2",
    "Fire Boy and Water Girl 3", "Five Nights at Freddy's", "Five Nights at Freddy's 2",
    "Five Nights at Freddy's 3", "Five Nights at Freddy's 4", "Five Nights at Freddy's Pizza Simulator",
    "Five Nights at Freddy's Sister Location", "Five Nights at Freddy's UCN",
    "Five Nights at Freddy's World", "Five Nights at Winston's", "Flappy Bird", "Flood Runner 2",
    "Flood Runner 3", "Flood Runner 4", "Football Bros", "Football Legends", "Fruit Ninja", "GBA Emulator",
    "Geometry Dash", "Getaway Shoot out", "Getting Over It", "Granny", "Granny 2", "Gun Knight",
    "Gun Mayhem", "Half Life", "Happy Wheels", "Heist", "Helix Jump", "Henry Stickmin Breaking the Bank",
    "Henry Stickmin Escaping the Prison", "Hill Climb Racing", "Hole io", "Hollow Knight",
    "Hollow Knight, Silk Song", "Hotline Miami", "Idle Miner Tycoon", "Jetpack Joyride", "Just Fall LOL",
    "Learn To Fly", "Learn To Fly 2", "Learn To Fly 3", "Legend of Zelda Majora's Mask",
    "Legend of Zelda Ocarina of Time", "Level Devil", "Little Alchemy 2", "Madalin Stunt Cars 2",
    "Madalin Stunt Cars 3", "Melon Playground", "Merge Round Racers", "Mine Sweeper", "Minecraft",
    "Monkey Mart", "Moto X3M", "Moto X3M 2", "Moto X3M 3", "Moto X3M Pool Party", "Moto X3M Spooky Land",
    "Moto X3M Winter", "Moto X3M Winter Land", "Only Up", "OvO", "OvO 2", "OvO 3", "Pac Man",
    "Papa's Bakeria", "Papa's Burgeria", "Papa's Cheeseria", "Papa's Cupcakeria", "Papa's Donuteria",
    "Papa's Freezeria", "Papa's Hot Doggeria", "Papa's Pancakeria", "Papa's Pastaria", "Papa's Pizzeria",
    "Papa's Scooperia", "Papa's Sushiria", "Papa's Tacoria", "Papa's Wingeria", "Paper io 2", "Parking Fury",
    "Parking Fury 2", "Parking Fury 3", "People Playground", "Pixel Shooter", "Plants vs Zombies",
    "Poly Track", "Pou", "Repo", "Retro Bowl", "Retro Bowl College", "Rocket Soccer", "Rolling Sky",
    "Rooftop Snipers", "Rooftop Snipers 2", "Run", "Run 2", "Run 3", "Sandtris", "Secret", "Slope",
    "Slope 2", "Slope 3", "Snake io", "Snow Rider 3D", "Snowball io", "Soccer Bros", "Soccer Random",
    "Speed Stars", "Stack", "Steal A Brainrot", "Stickman Climb", "Stickman Hook", "Stumble Guys",
    "Subway Surfers", "Super Hot", "Super Mario 64", "Temple Run 2", "Terraria", "Tetris",
    "The Impossible Quiz", "The Oregon Trail", "This is The Only Level", "Time Shooter 2",
    "Time Shooter 3 S.W.A.T", "Tiny Fishing", "Tomb of The Mask", "Tunnel Rush 2", "Vex 7", "Volley Random",
    "We Become What We Behold", "Wordle", "World Guessr", "World's Hardest Game 3", "Wrestle Bros"
  ];

  let games = [];       // [{ name, lower }]
  let searchDebounce = null;

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
  }

  function renderGames(list) {
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">No games found</div>';
      return;
    }

    const html = new Array(list.length);

    for (let i = 0; i < list.length; i++) {
      const name = list[i].name;
      const safe = escapeHtml(name);
      const cover = COVERS[name];

      const thumb = cover
        ? `<div class="fallback">${safe}</div>` +
          `<img src="${escapeHtml(cover)}" alt="${safe}" loading="lazy" ` +
            `referrerpolicy="no-referrer" ` +
            `onload="this.previousElementSibling.style.display='none'" ` +
            `onerror="this.style.display='none'">`
        : `<div class="fallback">${safe}</div>`;

      html[i] =
        `<a class="game-card" href="./${encodeURIComponent(name)}/" target="_blank">` +
          `<div class="thumb">${thumb}</div>` +
          `<div class="info"><div class="name">${safe}</div></div>` +
        `</a>`;
    }

    grid.innerHTML = html.join('');
  }

  function filterGames() {
    const q = search.value.trim().toLowerCase();

    const filtered = games.filter(g => {
      // Secret is ONLY shown when the search is exactly "secret",
      // regardless of capitalization.
      if (g.lower === 'secret') {
        return q === 'secret';
      }

      return q === '' || g.lower.includes(q);
    });

    renderGames(filtered);
  }

  // Debounce so it doesn't re-render on every single keystroke
  function onSearchInput() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(filterGames, 120);
  }

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;

      const parsed = JSON.parse(raw);

      if (Date.now() - parsed.timestamp > CACHE_TTL_MS) {
        return null;
      }

      return parsed.games;
    } catch {
      return null;
    }
  }

  function writeCache(list) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        timestamp: Date.now(),
        games: list
      }));
    } catch {
      // ignore quota/private-browsing errors
    }
  }

  function toGameList(items) {
    return items
      .filter(item =>
        item.type === 'dir' &&
        item.name.toLowerCase() !== 'images'
      )
      .map(item => item.name)
      .sort((a, b) => a.localeCompare(b));
  }

  async function fetchGamesFromApi() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);

    try {
      const res = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${GAMES_PATH}`,
        { signal: controller.signal }
      );

      clearTimeout(timeout);

      if (!res.ok) {
        throw new Error(`GitHub API returned ${res.status}`);
      }

      const items = await res.json();
      const list = toGameList(items);

      if (list.length === 0) {
        throw new Error('GitHub API returned no game folders');
      }

      return list;
    } finally {
      clearTimeout(timeout);
    }
  }

  function setGames(names) {
    games = names.map(name => ({ name, lower: name.toLowerCase() }));
    filterGames();
  }

  async function loadGames() {
    // 1. Show something instantly: cached list, otherwise the baked-in list
    const cached = readCache();

    setGames(cached || GAMES.slice().sort((a, b) => a.localeCompare(b)));

    // 2. Always refresh in the background
    try {
      const fresh = await fetchGamesFromApi();

      writeCache(fresh);
      setGames(fresh);
    } catch (err) {
      console.error('Failed to refresh games list:', err);
    }
  }

  search.addEventListener('input', onSearchInput);
  loadGames();
</script>

</body>
</html>
