<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at BIG E</title>
    <link rel="icon" type="image/png" href="../../logo.png">
    <!--
      Five Nights at BIG E (Unity WebGL build).
      The game files are NOT stored in this repository. They are loaded at runtime from the
      public web-ports/fnae GitHub repository, pinned to one commit, through the mirrors listed
      in MIRRORS below (jsDelivr first, then raw.githubusercontent.com as a fallback).
    -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      #unity-container { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #1F1F20; }
      #loader {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: safe center; gap: 18px; background: #000; color: #fff; overflow-y: auto;
        font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; text-align: center; padding: 16px;
      }
      #loader.hidden { display: none; }
      #loading-text {
        font-family: cursive; font-size: clamp(32px, 7vw, 48px); font-weight: bold;
        background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
        background-size: 400% 400%; -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; animation: rainbow 3s ease infinite;
      }
      @keyframes rainbow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      #progress-track { width: min(420px, 90vw); height: 14px; border-radius: 7px; background: #222; border: 1px solid #444; overflow: hidden; }
      #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff7f00, #ffff00); transition: width .2s linear; }
      #progress-detail { font-size: 15px; color: #ccc; min-height: 1.4em; font-variant-numeric: tabular-nums; }
      #status { font-size: 13px; color: #888; min-height: 1.4em; max-width: 90vw; }
      #error-box {
        display: none; max-width: min(640px, 92vw); text-align: left; background: #1a0b0b; border: 1px solid #7a2a2a;
        border-radius: 10px; padding: 16px 18px; color: #f3d6d6; font-size: 14px; line-height: 1.5;
      }
      #error-box.visible { display: block; }
      #error-box h2 { margin: 0 0 6px; font-size: 18px; color: #ff8a8a; }
      #error-box ul { margin: 8px 0; padding-left: 20px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #e0b8b8; word-break: break-all; }
      #error-box p { margin: 6px 0; }
      #retry-button {
        margin-top: 10px; font: inherit; font-weight: 600; color: #000; background: #ffcc00; border: 0;
        border-radius: 8px; padding: 8px 20px; cursor: pointer;
      }
      #retry-button:hover { background: #ffe066; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    </div>

    <div id="loader" role="status" aria-live="polite">
      <div id="loading-text">LOADING...</div>
      <div id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-detail">Preparing download…</div>
      <div id="status"></div>
      <div id="error-box" role="alert">
        <h2 id="error-title">The game could not be loaded</h2>
        <p id="error-message"></p>
        <button id="retry-button" type="button">Retry</button>
        <ul id="error-details"></ul>
        <p id="error-hint"></p>
      </div>
    </div>

    <script>
    (function () {
      "use strict";

      // ---- Configuration ---------------------------------------------------------------
      // Pinned commit of https://github.com/web-ports/fnae. Pinning keeps the build stable.
      var COMMIT = "c9c8b513a27155bf37c4ab3dee74e99b12b895ba";

      // Mirrors are tried in order for every file. A mirror that fails is demoted so the
      // remaining files go to the mirror that is working. Both mirrors serve CORS "*".
      // raw.githubusercontent.com serves everything as text/plain + nosniff, so scripts are
      // never referenced directly: they are fetched and run from same-page blob: URLs.
      var MIRRORS = [
        { name: "jsDelivr", base: "https://cdn.jsdelivr.net/gh/web-ports/fnae@" + COMMIT + "/" },
        { name: "GitHub (raw.githubusercontent.com)", base: "https://raw.githubusercontent.com/web-ports/fnae/" + COMMIT + "/" }
      ];

      // Every file the page needs, with its exact size in bytes at COMMIT. The sizes let us
      // reject error pages, truncated downloads and stale cache entries instead of handing
      // corrupt data to Unity.
      var PART = 20866662;
      var FILES = {
        loader:    { parts: [["Build/fnae.loader.js", 26982]], type: "text/javascript" },
        framework: { parts: [["Build/fnae.framework.js", 485490]], type: "text/javascript" },
        data:      { parts: [["Build/fnae.data.part1", PART], ["Build/fnae.data.part2", PART], ["Build/fnae.data.part3", 7213563]], type: "application/octet-stream" },
        wasm:      { parts: [["Build/fnae.wasm.part1", PART], ["Build/fnae.wasm.part2", PART], ["Build/fnae.wasm.part3", 11335108]], type: "application/wasm" },
        video:     { parts: [["StreamingAssets/202512191935.webm.part1", PART], ["StreamingAssets/202512191935.webm.part2", PART], ["StreamingAssets/202512191935.webm.part3", 19663685]], type: "video/webm" }
      };

      var STALL_TIMEOUT_MS = 30000;   // abort a download that receives no bytes for this long
      var MAX_PARALLEL = 4;           // simultaneous downloads
      var CACHE_NAME = "fnae-" + COMMIT.slice(0, 12);

      // ---- UI helpers ------------------------------------------------------------------
      var $ = function (id) { return document.getElementById(id); };
      var ui = {
        loader: $("loader"), text: $("loading-text"), track: $("progress-track"), fill: $("progress-fill"),
        detail: $("progress-detail"), status: $("status"), errorBox: $("error-box"), errorTitle: $("error-title"),
        errorMessage: $("error-message"), errorDetails: $("error-details"), errorHint: $("error-hint"), retry: $("retry-button")
      };
      var MB = 1024 * 1024;
      var allParts = [];
      Object.keys(FILES).forEach(function (k) { FILES[k].parts.forEach(function (p) { allParts.push(p); }); });
      var totalBytes = allParts.reduce(function (s, p) { return s + p[1]; }, 0);
      var received = {};   // path -> bytes received so far (download progress)

      function setProgress(fraction) {
        var pct = Math.max(0, Math.min(100, fraction * 100));
        ui.fill.style.width = pct.toFixed(1) + "%";
        ui.track.setAttribute("aria-valuenow", String(Math.round(pct)));
      }
      function updateDownloadProgress() {
        var done = 0;
        for (var k in received) done += received[k];
        setProgress(done / totalBytes);
        ui.detail.textContent = "Downloading " + (done / MB).toFixed(2) + " MB / " + (totalBytes / MB).toFixed(2) +
          " MB (" + Math.floor(100 * done / totalBytes) + "%)";
      }
      function setStatus(msg) { ui.status.textContent = msg || ""; }

      function showError(title, message, details, hint, retryMode) {
        ui.text.textContent = "LOADING FAILED";
        ui.errorTitle.textContent = title;
        ui.errorMessage.textContent = message;
        ui.errorDetails.innerHTML = "";
        (details || []).forEach(function (d) {
          var li = document.createElement("li");
          li.textContent = d;
          ui.errorDetails.appendChild(li);
        });
        ui.errorDetails.style.display = details && details.length ? "" : "none";
        ui.errorHint.textContent = hint || "";
        ui.retry.dataset.mode = retryMode || "download";
        ui.loader.classList.remove("hidden");
        ui.errorBox.classList.add("visible");
        ui.retry.focus();
      }
      function hideError() {
        ui.errorBox.classList.remove("visible");
        ui.text.textContent = "LOADING...";
      }

      // ---- Downloading -----------------------------------------------------------------
      function DownloadError(path, attempts) {
        this.name = "DownloadError";
        this.path = path;
        this.attempts = attempts;
        this.message = "Could not download " + path;
      }

      var mirrorOrder = MIRRORS.slice();
      var workingMirror = null;     // first mirror that delivered a file
      var memory = {};              // path -> Blob, survives in-page retries

      function openCache() {
        try {
          if (!window.caches || !window.isSecureContext) return Promise.resolve(null);
          return caches.open(CACHE_NAME).catch(function () { return null; });
        } catch (e) { return Promise.resolve(null); }
      }
      var cachePromise = openCache();
      function cacheKey(path) { return MIRRORS[0].base + path; }

      function readCached(path, size) {
        return cachePromise.then(function (cache) {
          if (!cache) return null;
          return cache.match(cacheKey(path)).then(function (res) {
            if (!res) return null;
            return res.blob().then(function (b) {
              if (b.size === size) return b;
              cache.delete(cacheKey(path));
              return null;
            });
          });
        }).catch(function () { return null; });
      }
      function writeCached(path, blob) {
        cachePromise.then(function (cache) {
          if (cache) return cache.put(cacheKey(path), new Response(blob));
        }).catch(function () { /* quota or private mode: caching is optional */ });
      }

      // Fetch one file from one mirror, reporting progress and enforcing the expected size.
      function fetchFrom(mirror, path, size) {
        var url = mirror.base + path;
        var controller = window.AbortController ? new AbortController() : null;
        var stallTimer = null;
        var stalled = false;
        function armStall() {
          clearTimeout(stallTimer);
          stallTimer = setTimeout(function () { stalled = true; if (controller) controller.abort(); }, STALL_TIMEOUT_MS);
        }
        armStall();
        received[path] = 0;
        return fetch(url, { mode: "cors", credentials: "omit", signal: controller ? controller.signal : undefined })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status + (res.statusText ? " " + res.statusText : ""));
            if (!res.body || !res.body.getReader) {
              return res.blob().then(function (b) { received[path] = b.size; updateDownloadProgress(); return [b]; });
            }
            var reader = res.body.getReader();
            var chunks = [];
            var got = 0;
            function pump() {
              return reader.read().then(function (r) {
                if (r.done) return chunks;
                armStall();
                got += r.value.length;
                if (got > size) throw new Error("received more data than expected (" + got + " > " + size + " bytes)");
                chunks.push(r.value);
                received[path] = got;
                updateDownloadProgress();
                return pump();
              });
            }
            return pump();
          })
          .then(function (chunks) {
            clearTimeout(stallTimer);
            var blob = new Blob(chunks);
            if (blob.size !== size) throw new Error("incomplete download (" + blob.size + " of " + size + " bytes)");
            return blob;
          })
          .catch(function (err) {
            clearTimeout(stallTimer);
            received[path] = 0;
            updateDownloadProgress();
            if (stalled) throw new Error("no data received for " + (STALL_TIMEOUT_MS / 1000) + " s (connection stalled)");
            if (err && err.name === "TypeError") {
              throw new Error("network error (" + err.message + ") — the host may be blocked, offline, or refused the request");
            }
            throw err;
          });
      }

      // Get one file: memory -> Cache Storage -> each mirror in turn.
      function getPart(path, size) {
        if (memory[path]) { received[path] = size; updateDownloadProgress(); return Promise.resolve(memory[path]); }
        return readCached(path, size).then(function (cached) {
          if (cached) {
            memory[path] = cached; received[path] = size; updateDownloadProgress();
            return cached;
          }
          var attempts = [];
          var order = mirrorOrder.slice();
          function next(i) {
            if (i >= order.length) throw new DownloadError(path, attempts);
            var mirror = order[i];
            setStatus("Downloading from " + mirror.name + "…");
            return fetchFrom(mirror, path, size).then(function (blob) {
              if (!workingMirror) workingMirror = mirror;
              memory[path] = blob;
              writeCached(path, blob);
              return blob;
            }, function (err) {
              attempts.push(mirror.name + ": " + (err && err.message ? err.message : String(err)));
              if (window.console) console.warn("[fnae] " + mirror.base + path + " failed:", err);
              // Demote the failing mirror for the remaining files.
              var idx = mirrorOrder.indexOf(mirror);
              if (idx !== -1 && mirrorOrder.length > 1) { mirrorOrder.splice(idx, 1); mirrorOrder.push(mirror); }
              return next(i + 1);
            });
          }
          return next(0);
        });
      }

      // Download every part with limited parallelism; resolves to { path: Blob }.
      function downloadAll() {
        var queue = allParts.slice();
        var results = {};
        var failures = [];
        function worker() {
          var item = queue.shift();
          if (!item) return Promise.resolve();
          return getPart(item[0], item[1]).then(function (blob) {
            results[item[0]] = blob;
          }, function (err) {
            failures.push(err);
          }).then(worker);
        }
        var workers = [];
        for (var i = 0; i < MAX_PARALLEL; i++) workers.push(worker());
        return Promise.all(workers).then(function () {
          if (failures.length) throw failures;
          return results;
        });
      }

      function assemble(results, key) {
        var f = FILES[key];
        var blob = new Blob(f.parts.map(function (p) { return results[p[0]]; }), { type: f.type });
        return URL.createObjectURL(blob);
      }

      // ---- Unity -----------------------------------------------------------------------
      function hasWebGL() {
        try {
          var c = document.createElement("canvas");
          return !!(window.WebGL2RenderingContext && c.getContext("webgl2")) || !!c.getContext("webgl");
        } catch (e) { return false; }
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = function () { reject(new Error("could not execute " + src)); };
          document.body.appendChild(s);
        });
      }

      // The game plays its intro video from StreamingAssets/202512191935.(mp4|webm). That file
      // is split into parts on the mirror, so the reassembled blob: URL is substituted here.
      function installVideoRedirect(videoUrl) {
        var desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
        if (!desc || !desc.set) return;
        Object.defineProperty(HTMLMediaElement.prototype, "src", {
          configurable: true,
          enumerable: desc.enumerable,
          set: function (value) {
            if (typeof value === "string" && /202512191935\.(mp4|webm)(\?|#|$)/.test(value)) value = videoUrl;
            return desc.set.call(this, value);
          },
          get: function () { return desc.get.call(this); }
        });
      }

      var unityStarted = false;
      var unityFailed = false;

      function unityShowBanner(msg, type) {
        if (type === "error") {
          unityFailed = true;
          showError("The game crashed while starting", "Unity reported an error:", [String(msg).replace(/<[^>]*>/g, "")],
            "Reload to try again. If this keeps happening, try another browser with WebGL and WebAssembly enabled.", "reload");
        } else if (window.console) {
          console.warn("[Unity] " + msg);
        }
      }

      function startUnity(results) {
        if (unityStarted) return;
        unityStarted = true;
        var urls = {
          loader: assemble(results, "loader"),
          framework: assemble(results, "framework"),
          data: assemble(results, "data"),
          wasm: assemble(results, "wasm"),
          video: assemble(results, "video")
        };
        installVideoRedirect(urls.video);

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.querySelector('meta[name="viewport"]');
          meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        }

        var streamingBase = (workingMirror || mirrorOrder[0]).base + "StreamingAssets";
        var config = {
          arguments: [],
          dataUrl: urls.data,
          frameworkUrl: urls.framework,
          codeUrl: urls.wasm,
          // Must be absolute: Unity resolves this against document.URL (not <base>), so a
          // relative value points at this site instead of the mirror.
          streamingAssetsUrl: streamingBase,
          companyName: "DefaultCompany",
          productName: "fnae",
          productVersion: "1.0",
          // The files are already cached above; stop Unity also storing every blob: URL in IndexedDB.
          cacheControl: function () { return "no-store"; },
          showBanner: unityShowBanner
        };

        setStatus("Starting the game engine…");
        ui.detail.textContent = "Download complete — starting Unity (0%)";
        setProgress(0);
        loadScript(urls.loader).then(function () {
          if (typeof createUnityInstance !== "function") throw new Error("Unity loader did not define createUnityInstance");
          return createUnityInstance($("unity-canvas"), config, function (progress) {
            setProgress(progress);
            ui.detail.textContent = "Starting Unity (" + Math.round(progress * 100) + "%)";
          });
        }).then(function (instance) {
          window.unityInstance = instance;
          if (unityFailed) return;
          ui.loader.classList.add("hidden");
          $("unity-canvas").focus();
        }).catch(function (err) {
          if (window.console) console.error("[fnae] Unity failed to start:", err);
          if (unityFailed) return;
          unityFailed = true;
          showError("The game engine failed to start", String(err && err.message ? err.message : err), [],
            "Reload to try again. The downloaded files are kept, so a reload is quick.", "reload");
        });
      }

      function run() {
        hideError();
        if (!hasWebGL()) {
          showError("WebGL is not available", "This game needs WebGL, which this browser or device has disabled or does not support.", [],
            "Enable hardware acceleration in your browser settings, or try an up-to-date Chrome, Edge or Firefox.", "reload");
          return;
        }
        if (typeof WebAssembly !== "object") {
          showError("WebAssembly is not available", "This game needs WebAssembly, which this browser has disabled or does not support.", [], "", "reload");
          return;
        }
        updateDownloadProgress();
        setStatus("Connecting…");
        downloadAll().then(startUnity, function (failures) {
          var list = Array.isArray(failures) ? failures : [failures];
          // Group files that failed for the same reasons so the message stays short.
          var groups = {}, order = [];
          list.forEach(function (f) {
            var reason = f instanceof DownloadError ? f.attempts.slice().sort().join("; ") : String(f && f.message ? f.message : f);
            if (!groups[reason]) { groups[reason] = []; order.push(reason); }
            if (f instanceof DownloadError) groups[reason].push(f.path);
          });
          var details = order.map(function (reason) {
            var paths = groups[reason];
            var who = paths.length === allParts.length ? "All files" :
              paths.length > 3 ? paths.length + " files (" + paths.slice(0, 3).join(", ") + ", …)" : paths.join(", ");
            return (who ? who + " — " : "") + reason;
          });
          var done = allParts.filter(function (p) { return memory[p[0]]; }).length;
          showError(
            "Download failed",
            list.length + " of " + allParts.length + " game files could not be downloaded (" + done + " finished and are kept for the retry).",
            details,
            "Every mirror was tried (" + MIRRORS.map(function (m) { return new URL(m.base).host; }).join(", ") +
              "). If you are on a school or work network, these hosts may be blocked. Check your connection and press Retry.",
            "download"
          );
          setStatus("");
        });
      }

      ui.retry.addEventListener("click", function () {
        if (ui.retry.dataset.mode === "reload") { location.reload(); return; }
        mirrorOrder = MIRRORS.slice();
        run();
      });

      window.addEventListener("unhandledrejection", function (e) {
        if (window.console) console.error("[fnae] unhandled rejection:", e.reason);
      });

      run();
    })();
    </script>
  </body>
</html>
